<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: sticky top bar, centered 1000px column of soft cards; home is a button grid; tathbeet pages are 6 surah cards */
:root{
  --bg:#FFF7F2; --card:#FFFFFF; --ink:#5A3A4B; --mute:#9A7B8B; --line:#F3DCE4;
  --pink:#F9B8CE; --pink-d:#E0709A; --yellow:#FFE8A3; --orange:#FFCBA0; --sky:#BDE3F6; --mint:#C6EBD2; --mint-d:#4FA777;
  --fill:#F48FB1; --fill-ink:#fff; --shadow:0 6px 18px rgba(224,112,154,.14);
  --fd:'Baloo Bhaijaan 2','Cairo',system-ui,sans-serif; --fb:'Cairo','Baloo Bhaijaan 2',system-ui,sans-serif; --fq:'Amiri','Traditional Arabic',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2A1F2B; --card:#3A2B3D; --ink:#FBE9F0; --mute:#C9A9BA; --line:#55405A;
  --pink:#7B4560; --pink-d:#F59BBE; --yellow:#6B5A2E; --orange:#6E4A31; --sky:#2E5063; --mint:#2F5A44; --mint-d:#7FD3A2;
  --fill:#F59BBE; --fill-ink:#2A1F2B; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2A1F2B; --card:#3A2B3D; --ink:#FBE9F0; --mute:#C9A9BA; --line:#55405A;
  --pink:#7B4560; --pink-d:#F59BBE; --yellow:#6B5A2E; --orange:#6E4A31; --sky:#2E5063; --mint:#2F5A44; --mint-d:#7FD3A2;
  --fill:#F59BBE; --fill-ink:#2A1F2B; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.7;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;line-height:1.35}
h2{font-size:1.5rem} h3{font-size:1.15rem}
.wrap{max-width:1000px;margin:0 auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.bar .ttl{font-family:var(--fd);font-weight:800;flex:1;min-width:120px;font-size:1.15rem}
button,.btn{font-family:var(--fb);font-size:1rem;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pink-d);outline-offset:2px}
.btn.pink{background:var(--pink);border-color:var(--pink)}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sub{color:var(--mute);font-size:.9rem}
.tile{border:0;border-radius:26px;padding:18px 14px;flex-direction:column;justify-content:center;text-align:center;min-height:110px;font-family:var(--fd);font-weight:700;font-size:1.1rem;box-shadow:var(--shadow);color:#5A3A4B}
.tile .ic{font-size:2rem;line-height:1}
.c-pink{background:var(--pink)} .c-yellow{background:var(--yellow)} .c-orange{background:var(--orange)} .c-sky{background:var(--sky)} .c-mint{background:var(--mint)}
[data-theme="dark"] .tile,:root:not([data-theme="light"]) .tile{color:var(--ink)}
@media (prefers-color-scheme:light){.tile{color:#5A3A4B}}
input[type=text],input[type=date],input[type=number],textarea,select{font-family:var(--fb);font-size:1rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 12px;width:100%;min-height:44px}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:2px solid var(--line);cursor:pointer;min-height:48px;background:var(--bg);width:100%;text-align:right;justify-content:flex-start}
.chk .bx{width:28px;height:28px;border-radius:9px;border:2.5px solid var(--pink-d);flex:none;display:grid;place-items:center;color:var(--fill-ink);font-weight:800}
.chk[aria-pressed=true]{background:var(--mint)}
.chk[aria-pressed=true] .bx{background:var(--mint-d);border-color:var(--mint-d)}
.chk[aria-pressed=true] .bx::after{content:"✓"}
.yn{display:inline-flex;gap:6px}
.yn button{padding:6px 16px;min-height:40px}
.yn button[aria-pressed=true]{background:var(--fill);color:var(--fill-ink);border-color:var(--fill)}
.bar2{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar2>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink-d),var(--yellow));border-radius:99px;transition:width .3s}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{border-radius:20px;padding:12px;text-align:center}
.stat b{font-family:var(--fd);font-size:1.8rem;display:block;line-height:1.2;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .d{aspect-ratio:1;min-height:44px;border-radius:14px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:.95rem;font-variant-numeric:tabular-nums;position:relative;padding:0;text-decoration:none;color:var(--ink)}
.cal .d.p1{background:var(--yellow)} .cal .d.p2{background:var(--orange)} .cal .d.p3{background:var(--mint)} .cal .d.full{background:var(--fill);color:var(--fill-ink);border-color:var(--fill)}
.cal .d.today{outline:3px solid var(--sky)} .cal .d.off{opacity:.25;pointer-events:none}
.cal .h{text-align:center;font-weight:700;color:var(--mute);font-size:.85rem}
.boxes{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;direction:ltr}
.boxes button{padding:0;min-height:0;aspect-ratio:1;border-radius:8px;border:2px solid var(--line);font-size:.7rem;font-weight:600;color:var(--mute);background:var(--bg);justify-content:center;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.boxes button.on{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.sc{display:flex;flex-direction:column;gap:10px}
.sc .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.sc .nm{font-family:var(--fd);font-weight:800;font-size:1.2rem}
.sc.done{background:linear-gradient(var(--card),var(--card)) padding-box;border-color:var(--mint-d)}
.heart{position:relative;margin:0 auto;max-width:760px}
.heart svg{width:100%;height:auto;display:block}
.sn{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.sn button{padding:2px 8px;min-height:36px;font-size:.88rem;border-width:1.5px}
.sn button.s1{background:var(--yellow)} .sn button.s2{background:var(--sky)} .sn button.s3{background:var(--fill);color:var(--fill-ink);border-color:var(--fill)}
.modal{position:fixed;inset:0;background:rgba(60,30,50,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal .card{max-width:440px;width:100%;max-height:86vh;overflow:auto}
.q{font-family:var(--fq);font-size:1.45rem;line-height:2;color:var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button[aria-pressed=true]{background:var(--pink);border-color:var(--pink)}
.wrapx{overflow-x:auto}
table{border-collapse:separate;border-spacing:0 6px;width:100%;min-width:620px}
th{font-family:var(--fd);text-align:right;padding:6px 8px;color:var(--mute);font-size:.9rem}
td{padding:4px}
.cover{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:14px;align-items:center}
.cover h1{font-size:clamp(2rem,6vw,3.2rem);color:var(--pink-d)}
.cert{border:6px double var(--pink-d);border-radius:28px;padding:28px;text-align:center;background:var(--card)}
.cart{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mcard{border-radius:22px;padding:16px;min-height:120px;text-align:center;font-weight:700;display:grid;place-items:center;border:0;color:var(--ink);line-height:1.8}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px;z-index:60;font-size:.9rem}
@media (max-width:520px){.cal{gap:4px}.boxes{gap:3px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  }

    const all=new Set(Object.keys(S).map(shardOf)); all.forEach(s=>{ if(!bySh[s])dirty.add(s); });
